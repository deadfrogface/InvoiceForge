name: Bookkeeping tests
on:
  push:
    branches: [feature/bookkeeping-foundation, feature/bundled-offline-dependencies, main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Taxonomy archive security tests
        run: python3 -m unittest discover -s test -p "*_test.py" -v
