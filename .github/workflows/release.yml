name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_run:
    workflows: ['Bookkeeping tests']
    branches: [main]
    types: [completed]

concurrency:
  group: invoiceforge-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '1.0.1-alpha.${{ github.run_number }}'
          }
          npm pkg set "version=$version"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Require passing regression tests
        run: npm test
      - name: Stage hash-pinned official taxonomy packages
        run: npm run stage:taxonomies
      - name: Require complete official taxonomy resources
        run: npm run verify:taxonomies
      - name: Install build-time native tools
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: invoiceforge-runtime
          create-args: >-
            -c conda-forge
            poppler
            tesseract=5.5
            openjdk=21
          init-shell: powershell
          cache-environment: true
      - name: Bundle native tools and validator with their runtimes
        shell: pwsh
        run: ./scripts/stage-windows-runtime.ps1
      - name: Require bundled offline runtimes
        run: npm run verify:bundle
      - name: Install fixture generators (build-time only)
        run: python -m pip install Pillow reportlab
      - name: Exercise real bundled OCR
        run: |
          python test/native/create-ocr-fixtures.py "$env:RUNNER_TEMP/ocr-fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture creation failed' }
          node test/native/verify-ocr.js "$env:RUNNER_TEMP/ocr-fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Native OCR failed' }
      - name: Exercise official invoice validation
        run: node test/native/verify-einvoice.js
      - name: Icon erzeugen
        run: npm run create-icon
      - name: Installer bauen
        run: npm run build -- --publish never
      - name: Exercise packaged OCR resources
        env:
          INVOICEFORGE_TEST_RESOURCES: ${{ github.workspace }}/dist/win-unpacked/resources
        run: node test/native/verify-ocr.js "$env:RUNNER_TEMP/ocr-fixtures"
      - name: Release erstellen und Installer anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: InvoiceForge ${{ steps.version.outputs.value }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Desktop-Testversion mit gebündelter Offline-OCR und XRechnung-Validierung.
            E-Bilanz-Unternehmensexport, vollständige Steuerlogik und fachliche Abschlussfreigabe sind weiterhin in Entwicklung.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceForge-Installer
          path: dist/*.exe
          if-no-files-found: error
